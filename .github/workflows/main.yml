name: COBOL Check Automation

on:
  push:
    branches: [ main ]

jobs:
  cobol-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Zowe CLI
        run: npm install -g @zowe/cli@zowe-v2-lts

      - name: Verify Zowe CLI
        run: |
          node --version
          which zowe
          zowe --version

      - name: Setup Mainframe Environment and Upload COBOL Check
        env:
          ZOWE_USERNAME: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_OPT_USER: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_OPT_PASSWORD: ${{ secrets.ZOWE_PASSWORD }}
          ZOWE_OPT_HOST: ${{ secrets.ZOWE_HOST }}
          ZOWE_OPT_PORT: ${{ secrets.ZOWE_PORT }}
          ZOWE_OPT_REJECT_UNAUTHORIZED: false
        run: |
          chmod +x .github/scripts/zowe_operations.sh
          .github/scripts/zowe_operations.sh

      - name: Run COBOL Check on Mainframe
        env:
          ZOWE_USERNAME: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_OPT_USER: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_OPT_PASSWORD: ${{ secrets.ZOWE_PASSWORD }}
          ZOWE_OPT_HOST: ${{ secrets.ZOWE_HOST }}
          ZOWE_OPT_PORT: ${{ secrets.ZOWE_PORT }}
          ZOWE_OPT_REJECT_UNAUTHORIZED: false
          SSHPASS: ${{ secrets.ZOWE_PASSWORD }}
          SSH_HOST_KEY: "ssh-rsa "
        run: |
          USERID="$(echo "$ZOWE_USERNAME" | tr '[:upper:]' '[:lower:]')"
          USERDIR="/z/$USERID"

          # 1. Envoyer le script sur le mainframe (via z/OSMF)
          zowe zos-files upload file-to-uss .github/scripts/mainframe_operations.sh "$USERDIR/mainframe_operations.sh"

          # 2. Installer sshpass (connexion SSH par mot de passe, sans terminal)
          sudo apt-get install -y -qq sshpass

          # 3. Faire confiance a la cle verifiee du serveur
          mkdir -p ~/.ssh
          echo "$ZOWE_OPT_HOST $SSH_HOST_KEY" >> ~/.ssh/known_hosts

          # 4. Executer le script sur le mainframe (via SSH)
          sshpass -e ssh -o StrictHostKeyChecking=yes \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            "$USERID@$ZOWE_OPT_HOST" "cd $USERDIR && sh mainframe_operations.sh"

      - name: Submit test jobs
        env:
          ZOWE_USERNAME: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_OPT_USER: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_OPT_PASSWORD: ${{ secrets.ZOWE_PASSWORD }}
          ZOWE_OPT_HOST: ${{ secrets.ZOWE_HOST }}
          ZOWE_OPT_PORT: ${{ secrets.ZOWE_PORT }}
          ZOWE_OPT_REJECT_UNAUTHORIZED: false
        run: |
          HLQ="$(echo "$ZOWE_USERNAME" | tr '[:lower:]' '[:upper:]')"
          FAILED=0

          for program in EMPPAY DEPTPAY; do
            echo "========== $program =========="
            OUTPUT=$(zowe zos-jobs submit data-set "$HLQ.JCL($program)" --view-all-spool-content)
            echo "$OUTPUT"

            if ! echo "$OUTPUT" | grep -q "TEST CASES WERE EXECUTED"; then
              echo "::error::$program : tests non executes (erreur de compilation ou de JCL ?)"
              FAILED=1
            elif echo "$OUTPUT" | grep -Eq '^ *[1-9][0-9]* FAILED'; then
              echo "::error::$program : des tests ont echoue"
              FAILED=1
            else
              echo "$program : tous les tests sont passes"
            fi
          done

          exit $FAILED
