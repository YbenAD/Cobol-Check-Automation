name: COBOL Check Automation

on:
  push:
    branches: [ main ]

jobs:
  cobol-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Zowe CLI
        run: npm install -g @zowe/cli@zowe-v2-lts

      - name: Verify Zowe CLI
        run: |
          node --version
          which zowe
          zowe --version

      - name: Setup Mainframe Environment and Upload COBOL Check
        env:
          ZOWE_USERNAME: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_OPT_USER: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_OPT_PASSWORD: ${{ secrets.ZOWE_PASSWORD }}
          ZOWE_OPT_HOST: ${{ secrets.ZOWE_HOST }}
          ZOWE_OPT_PORT: ${{ secrets.ZOWE_PORT }}
          ZOWE_OPT_REJECT_UNAUTHORIZED: false
        run: |
          chmod +x .github/scripts/zowe_operations.sh
          .github/scripts/zowe_operations.sh

      - name: Run COBOL Check on Mainframe
        env:
          ZOWE_USERNAME: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_OPT_USER: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_OPT_PASSWORD: ${{ secrets.ZOWE_PASSWORD }}
          ZOWE_OPT_HOST: ${{ secrets.ZOWE_HOST }}
          ZOWE_OPT_PORT: ${{ secrets.ZOWE_PORT }}
          ZOWE_OPT_REJECT_UNAUTHORIZED: false
          SSHPASS: ${{ secrets.ZOWE_PASSWORD }}
          SSH_HOST_KEY: "ssh-rsa "
        run: |
          USERID="$(echo "$ZOWE_USERNAME" | tr '[:upper:]' '[:lower:]')"
          USERDIR="/z/$USERID"

          # 1. Envoyer le script sur le mainframe (via z/OSMF)
          zowe zos-files upload file-to-uss .github/scripts/mainframe_operations.sh "$USERDIR/mainframe_operations.sh"

          # 2. Installer sshpass (connexion SSH par mot de passe, sans terminal)
          sudo apt-get install -y -qq sshpass

          # 3. Faire confiance a la cle verifiee du serveur
          mkdir -p ~/.ssh
          echo "$ZOWE_OPT_HOST $SSH_HOST_KEY" >> ~/.ssh/known_hosts

          # 4. Executer le script sur le mainframe (via SSH)
          sshpass -e ssh -o StrictHostKeyChecking=yes \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            "$USERID@$ZOWE_OPT_HOST" "cd $USERDIR && sh mainframe_operations.sh"

      - name: Submit test jobs
        env:
          ZOWE_USERNAME: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_OPT_USER: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_OPT_PASSWORD: ${{ secrets.ZOWE_PASSWORD }}
          ZOWE_OPT_HOST: ${{ secrets.ZOWE_HOST }}
          ZOWE_OPT_PORT: ${{ secrets.ZOWE_PORT }}
          ZOWE_OPT_REJECT_UNAUTHORIZED: false
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          HLQ="$(echo "$ZOWE_USERNAME" | tr '[:lower:]' '[:upper:]')"
          FAILED=0

          # 1. Fichiers modifies par ce push (tout si commit precedent introuvable)
          if git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
          else
            CHANGED=$(git ls-files)
          fi

          # 2. Programmes concernes : source, tests ou JCL modifies
          PROGRAMS=""
          for program in EMPPAY DEPTPAY; do
            if echo "$CHANGED" | grep -Eq "^cobol-check/(src/main/cobol/$program\.CBL|src/test/cobol/$program/|$program\.JCL)"; then
              PROGRAMS="$PROGRAMS $program"
            fi
          done

          if [ -z "$PROGRAMS" ]; then
            echo "Aucun programme modifie : pas de job a soumettre."
            exit 0
          fi
          echo "Programmes a tester :$PROGRAMS"

          # 3. Soumission et lecture du seul SYSOUT de l'etape RUN
          for program in $PROGRAMS; do
            echo "========== $program =========="
            JOB=$(zowe zos-jobs submit data-set "$HLQ.JCL($program)" --wait-for-output --rfj)
            JOBID=$(echo "$JOB" | jq -r '.data.jobid')
            RETCODE=$(echo "$JOB" | jq -r '.data.retcode')
            echo "Job $JOBID termine : $RETCODE"

            SPOOLID=$(zowe zos-jobs list spool-files-by-jobid "$JOBID" --rfj \
              | jq -r '.data[] | select(.stepname=="RUN" and .ddname=="SYSOUT") | .id')

            if [ -z "$SPOOLID" ]; then
              echo "::error::$program : etape RUN absente (erreur de compilation ?). Voir le job $JOBID dans Zowe Explorer."
              FAILED=1
              continue
            fi

            OUTPUT=$(zowe zos-jobs view spool-file-by-id "$JOBID" "$SPOOLID")
            echo "$OUTPUT"

            if echo "$OUTPUT" | grep -Eq '^ *[1-9][0-9]* FAILED'; then
              echo "::error::$program : des tests ont echoue"
              FAILED=1
            else
              echo "$program : tous les tests sont passes"
            fi
          done

          exit $FAILED
