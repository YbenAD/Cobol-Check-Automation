name: COBOL Check Automation

on:
  push:
    branches: [ main ]

jobs:
  cobol-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Zowe CLI
        run: npm install -g @zowe/cli@zowe-v2-lts

      - name: Verify Zowe CLI
        run: |
          node --version
          which zowe
          zowe --version

      - name: Setup Mainframe Environment and Upload COBOL Check
        env:
          ZOWE_USERNAME: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_OPT_USER: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_OPT_PASSWORD: ${{ secrets.ZOWE_PASSWORD }}
          ZOWE_OPT_HOST: ${{ secrets.ZOWE_HOST }}
          ZOWE_OPT_PORT: ${{ secrets.ZOWE_PORT }}
          ZOWE_OPT_REJECT_UNAUTHORIZED: false
        run: |
          chmod +x .github/scripts/zowe_operations.sh
          .github/scripts/zowe_operations.sh

      - name: Run COBOL Check on Mainframe
        env:
          ZOWE_USERNAME: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_OPT_USER: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_OPT_PASSWORD: ${{ secrets.ZOWE_PASSWORD }}
          ZOWE_OPT_HOST: ${{ secrets.ZOWE_HOST }}
          ZOWE_OPT_PORT: ${{ secrets.ZOWE_PORT }}
          ZOWE_OPT_REJECT_UNAUTHORIZED: false
        run: |
          USERDIR="/z/$(echo "$ZOWE_USERNAME" | tr '[:upper:]' '[:lower:]')"

          # 1. Envoyer le script sur le mainframe (via z/OSMF)
          zowe zos-files upload file-to-uss .github/scripts/mainframe_operations.sh "$USERDIR/mainframe_operations.sh"

          # 2. L'exécuter sur le mainframe (via SSH)
          zowe zos-uss issue ssh "sh mainframe_operations.sh" --cwd "$USERDIR" --port 22
